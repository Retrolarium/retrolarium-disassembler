name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
defaults:
  run:
    shell: python {0}
    working-directory: retrolarium-disassembler
jobs:
  test:
    name: Unit tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: retrolarium-disassembler
      - name: Read pinned Core revision
        id: core_ref
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, "tools/core_pin.py"], check=True)
      - uses: actions/checkout@v4
        with:
          repository: Retrolarium/retrolarium-core
          ref: ${{ steps.core_ref.outputs.sha }}
          path: retrolarium-core
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, "tools/test.py", "--suite", "python"], check=True)
