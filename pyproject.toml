[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retrolarium-disassembler"
version = "0.5.0"
description = "Exact-rebuild disassembler for NES, Mega Drive and SNES images"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
classifiers = [
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]
dependencies = [
  "retrolarium-core @ git+https://github.com/Retrolarium/retrolarium-core@0a5402205cb2485e9fc861b970131efd7ccb38c9",
]

[project.optional-dependencies]
# `rldisasm preset` turns a recognized game into a Studio project.
studio = ["retrolarium-kit"]

[project.scripts]
rldisasm = "retrolarium_disassembler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
retrolarium_disassembler = [
  "ghidra/scripts/*.java",
  "toolchains/*.json",
  "toolchains/backends/*.zip",
  "toolchains/backends/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
